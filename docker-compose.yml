# Ambiente local de desenvolvimento do ACIF (ADR 0005: tudo local, em containers).
# Funciona sem .env: os padrões abaixo são só de desenvolvimento.
name: acif

x-node: &node
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  init: true
  volumes:
    - .:/app
    # node_modules vem da imagem, não do host
    - /app/node_modules
    - /app/backend/node_modules
    - /app/frontend/node_modules

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-acif}:${POSTGRES_PASSWORD:-acif_dev}@db:5432/${POSTGRES_DB:-acif}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acif_dev}
      POSTGRES_DB: ${POSTGRES_DB:-acif}
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+: o volume é montado em /var/lib/postgresql (não em .../data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *node
    command: ['npm', 'run', 'dev', '-w', 'backend']
    environment:
      <<: *db-env
      API_PORT: '3333'
      API_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3333}:3333'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    <<: *node
    command: ['npm', 'run', 'worker:dev', '-w', 'backend']
    environment:
      <<: *db-env
      WORKER_INTERVALO_MS: ${WORKER_INTERVALO_MS:-5000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *node
    command: ['npm', 'run', 'dev', '-w', 'frontend']
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-5173}:5173'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
