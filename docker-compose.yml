# Ambiente local de desenvolvimento do ACIF (ADR 0005: tudo local, em containers).
# Funciona sem .env: os padrões abaixo são só de desenvolvimento.
name: acif

x-node: &node
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  init: true
  volumes:
    - .:/app
    # node_modules vem da imagem, não do host
    - /app/node_modules
    - /app/backend/node_modules
    - /app/frontend/node_modules

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-acif}:${POSTGRES_PASSWORD:-acif_dev}@db:5432/${POSTGRES_DB:-acif}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acif_dev}
      POSTGRES_DB: ${POSTGRES_DB:-acif}
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+: o volume é montado em /var/lib/postgresql (não em .../data)
      - pgdata:/var/lib/postgresql
      # Cria o banco acif_test (testes de integração) na primeira inicialização do volume
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Roda uma vez e termina: gera o cliente Prisma, aplica as migrations e, se SEED_AUTO não for false,
  # roda o seed (só dados sintéticos, pode rodar de novo sem duplicar). api e worker esperam ele terminar.
  # Roda com o uid/gid do host para que o cliente gerado (backend/src/generated) não fique com dono root.
  migrate:
    <<: *node
    user: '${ACIF_UID:-1000}:${ACIF_GID:-1000}'
    command:
      - sh
      - -c
      - >-
        npm run db:generate -w backend &&
        npm run db:deploy -w backend &&
        if [ "$${SEED_AUTO}" = "false" ]; then echo '{"evento":"seed_pulado"}'; else npm run db:seed -w backend; fi
    environment:
      <<: *db-env
      HOME: /tmp
      # O aviso de atualização do Prisma sugere a tag latest (hoje um RC 8.x); a versão é fixada em 7.10.1
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
      SEED_AUTO: ${SEED_AUTO:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA:-}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *node
    command: ['npm', 'run', 'dev', '-w', 'backend']
    environment:
      <<: *db-env
      API_PORT: '3333'
      API_HOST: 0.0.0.0
      NODE_ENV: development
      # Vazio = segredo só de desenvolvimento (a API avisa no log). Em produção é obrigatório.
      JWT_SECRET: ${JWT_SECRET:-}
      SESSAO_HORAS: ${SESSAO_HORAS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      CADASTRO_RATE_LIMIT_MAX: ${CADASTRO_RATE_LIMIT_MAX:-5}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3333}:3333'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    <<: *node
    command: ['npm', 'run', 'worker:dev', '-w', 'backend']
    environment:
      <<: *db-env
      WORKER_INTERVALO_MS: ${WORKER_INTERVALO_MS:-5000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    <<: *node
    command: ['npm', 'run', 'dev', '-w', 'frontend']
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-5173}:5173'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
