# Fonte de verdade das tasks do ACIF.
# Altere status, branch, pr e concluida_em pelas skills /executar-task, /revisar-task e /fechar-task.
#
# Replanejamento de 03/11/2026 (detalhes em docs/roadmap.md):
# - marcos redistribuídos entre 03/11 e 30/11/2026;
# - T15 antecipada de M2 para M1; T08 passa a depender de T15;
# - T15 depende de T01 e só do ADR 0006, em vez da T05 inteira;
#
# Campo opcional depende_adr: ADRs que precisam estar decididos (Aceito ou
# Rejeitado) para a task ser elegível. Ausente equivale a nenhum.
# - T10 inclui as telas do formulário público do aluno e de cadastro e aprovação de docentes;
# - T05 inclui os ADRs 0008 e 0009;
# - T33 (N3) nasce como cut e sem agente.
#
# Decisões do orientador registradas em 03/11 e 04/11/2026 (docs/adr/):
# - tudo local até a apresentação: T34, T11, T36 e M5 sem URL pública;
# - telas de configuração de e-mail e WhatsApp: novas T42 e T43;
# - LGPD acadêmica: T03, T35, T36, T37 e nova T44;
# - Groq + Gemini em round robin e Meta Cloud API: T19, T21, T25;
# - texto do TCC entregue até 25/11/2026: T39 sai de M6 para M5 e não espera T38.
# - 10/11/2026: o aluno antecipou a entrega do texto para 16/11/2026; T39 passa para M3.

