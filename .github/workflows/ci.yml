name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    # Banco só para os testes de integração (migration do zero e seed); credenciais de CI, sem segredo.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: acif
          POSTGRES_PASSWORD: acif_ci
          POSTGRES_DB: acif_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acif -d acif_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://acif:acif_ci@localhost:5432/acif_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: docker compose up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Usuário do runner para o serviço migrate
        # O migrate grava o cliente Prisma no código montado; precisa do mesmo dono da pasta
        run: |
          echo "ACIF_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "ACIF_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose config -q
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: docker compose ps
      - name: Migration e seed (serviço migrate)
        run: |
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
          docker compose logs migrate
      - name: Contagens do seed (1 admin, 20 alunos, 2 canais)
        run: |
          contar() { docker compose exec -T db psql -U acif -d acif -tAc "$1"; }
          test "$(contar "select count(*) from usuarios where papel = 'admin'")" = "1"
          test "$(contar "select count(*) from alunos")" = "20"
          test "$(contar "select count(*) from canais")" = "2"
          test "$(contar "select count(*) from alunos where email not like '%@example.com'")" = "0"
      - run: curl -fsS http://127.0.0.1:3333/health
      - name: Auth de ponta a ponta (T06)
        # Admin do seed com a senha só de desenvolvimento, que já está no Git (prisma/seed-dados.ts).
        # Mostra só os status; o token fica no cookie jar e não vai para o log.
        run: |
          api=http://127.0.0.1:3333
          jar="$RUNNER_TEMP/cookies.txt"
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          login=$(status -c "$jar" -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","senha":"acif-dev-somente-local"}' "$api/auth/login")
          echo "login: $login"; test "$login" = "200"
          me=$(status -b "$jar" "$api/auth/me")
          echo "/auth/me com cookie: $me"; test "$me" = "200"
          sem=$(status "$api/auth/me")
          echo "/auth/me sem cookie: $sem"; test "$sem" = "401"
          errada=$(status -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","senha":"senha-errada-qualquer"}' "$api/auth/login")
          echo "login com senha errada: $errada"; test "$errada" = "401"
      - name: Docentes de ponta a ponta (T07)
        # Docente sintético (example.com). Mostra só os status; corpos e tokens não vão para o log.
        run: |
          api=http://127.0.0.1:3333
          admin="$RUNNER_TEMP/admin.txt"
          docente="$RUNNER_TEMP/docente.txt"
          email='t07.e2e@example.com'
          senha='senha-sintetica-t07-e2e'
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          json=(-H 'Content-Type: application/json')
          cadastro=$(status "${json[@]}" \
            -d "{\"nome\":\"Docente E2E Sintetico\",\"email\":\"$email\",\"senha\":\"$senha\"}" \
            "$api/docentes/cadastro")
          echo "cadastro: $cadastro"; test "$cadastro" = "202"
          pendente=$(status "${json[@]}" -d "{\"email\":\"$email\",\"senha\":\"$senha\"}" "$api/auth/login")
          echo "login do docente pendente: $pendente"; test "$pendente" = "401"
          login=$(status -c "$admin" "${json[@]}" \
            -d '{"email":"admin@example.com","senha":"acif-dev-somente-local"}' "$api/auth/login")
          echo "login do admin: $login"; test "$login" = "200"
          id=$(curl -fsS -b "$admin" "$api/docentes?status=pendente&por_pagina=50" \
            | jq -r --arg e "$email" '.itens[] | select(.email == $e) | .id')
          test -n "$id"
          aprovar=$(status -X POST -b "$admin" "$api/docentes/$id/aprovar")
          echo "aprovar: $aprovar"; test "$aprovar" = "200"
          entrou=$(status -c "$docente" "${json[@]}" \
            -d "{\"email\":\"$email\",\"senha\":\"$senha\"}" "$api/auth/login")
          echo "login do docente aprovado: $entrou"; test "$entrou" = "200"
          me=$(status -b "$docente" "$api/auth/me")
          echo "/auth/me do docente: $me"; test "$me" = "200"
          proibido=$(status -b "$docente" "$api/docentes")
          echo "docente em /docentes: $proibido"; test "$proibido" = "403"
          bloquear=$(status -X POST -b "$admin" "$api/docentes/$id/bloquear")
          echo "bloquear: $bloquear"; test "$bloquear" = "200"
          caiu=$(status -b "$docente" "$api/auth/me")
          echo "/auth/me do docente bloqueado: $caiu"; test "$caiu" = "401"
      - run: curl -fsS http://127.0.0.1:5173/ | grep -i '<title>ACIF</title>'
      - name: Worker emitiu heartbeat
        run: |
          for _ in $(seq 1 12); do
            docker compose logs worker | grep -q heartbeat && exit 0
            sleep 5
          done
          docker compose logs worker
          exit 1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
